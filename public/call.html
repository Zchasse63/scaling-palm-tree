<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Call</title>
<style>
  body{margin:0;font-family:-apple-system,system-ui,Helvetica,Arial,sans-serif;background:#111;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center}
  main{text-align:center;padding:24px}
  a.btn{display:block;margin:0 auto 16px;max-width:360px;padding:22px 28px;border-radius:14px;background:#1f8a3b;color:#fff;font-size:28px;font-weight:600;text-decoration:none}
  p{color:#bbb;font-size:15px;margin:8px 0}
  .err{color:#f66}
</style>
</head>
<body>
<main>
  <a id="btn" class="btn" href="#">Call</a>
  <p id="msg">Opening the dialer. If nothing happens, tap the button.</p>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var n = (q.get('n') || '').replace(/\D/g, '');
  if (n.length === 11 && n[0] === '1') n = n.slice(1);
  var btn = document.getElementById('btn'), msg = document.getElementById('msg');
  if (n.length !== 10) {
    btn.textContent = 'No number';
    msg.textContent = 'This link has no valid phone number.';
    msg.className = 'err';
    return;
  }
  var pretty = n.slice(0, 3) + '-' + n.slice(3, 6) + '-' + n.slice(6);
  var tel = 'tel:+1' + n;
  btn.href = tel;
  btn.textContent = 'Call ' + pretty;
  document.title = 'Call ' + pretty;
  // Record the tap (fire and forget). The dialer opens whether or not this succeeds.
  try {
    var ev = JSON.stringify({ phone: n, usdot: (q.get('u') || '').replace(/\D/g, ''), source: 'sheet', at: new Date().toISOString() });
    if (!(navigator.sendBeacon && navigator.sendBeacon('/api/call-tap', new Blob([ev], { type: 'application/json' })))) {
      fetch('/api/call-tap', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: ev, keepalive: true }).catch(function () {});
    }
  } catch (e) {}
  setTimeout(function () { location.href = tel; }, 250);
})();
</script>
</body>
</html>
